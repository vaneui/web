name: Submit URLs to IndexNow

# Tells Bing and the other IndexNow engines about every sitemap URL after a production deploy.
# Vercel's GitHub integration reports each deploy as a deployment status.
on:
  deployment_status:
  workflow_dispatch:

permissions: {}

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: vaneui.com
      # Public by design: the same key is served at https://vaneui.com/<key>.txt (public/<key>.txt)
      KEY: ec9fdd632f2ec35dadf86895f61340ac
    steps:
      # Best effort: a failed fetch or a non-2xx answer is logged as a warning, not a failed run.
      - name: Submit Sitemap URLs
        run: |
          urls=$(curl -fsS --retry 3 --max-time 30 "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's#<loc>##' -e 's#</loc>##') || urls=''
          if [ -z "$urls" ]; then
            echo "::warning::No URLs read from https://$HOST/sitemap.xml"
            exit 0
          fi
          echo "Submitting $(echo "$urls" | wc -l) URLs"
          jq -n --arg host "$HOST" --arg key "$KEY" --arg urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: ($urls | split("\n"))}' > payload.json
          status=$(curl -sS -o response.txt -w '%{http_code}' --max-time 30 \
            -H 'Content-Type: application/json; charset=utf-8' --data @payload.json \
            https://api.indexnow.org/indexnow) || status=000
          echo "IndexNow answered HTTP $status"
          case "$status" in
            2??) ;;
            *) echo "::warning::IndexNow answered HTTP $status: $(head -c 300 response.txt 2>/dev/null)" ;;
          esac
