name: Submit changed URLs to IndexNow

# After a production deploy, tells Bing and the other IndexNow engines which sitemap URLs are new,
# changed (their <lastmod> moved) or removed since the previous run (scripts/indexnow.mjs).
# Vercel's GitHub integration reports each deploy as a deployment status. The previous run's
# sitemap is kept as the workflow artifact "indexnow-state": the Actions cache refuses
# deployment_status events, which carry no branch. Without it (first run, or no deploy for 30
# days) every URL is submitted. Run it by hand with "all" to resubmit every URL.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: Submit every sitemap URL, not only the changed ones
        type: boolean
        default: false

permissions:
  contents: read
  # To find and download the previous run's artifact
  actions: read

# Runs one at a time, so each one compares against the state the one before it saved
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: vaneui.com
      # Public by design: the same key is served at https://vaneui.com/<key>.txt (public/<key>.txt)
      KEY: ec9fdd632f2ec35dadf86895f61340ac
      STATE: .indexnow/sitemap.tsv
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Best effort: without the previous submission every URL is submitted.
      - name: Restore the previous submission
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=indexnow-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then
            echo "No previous submission saved"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/indexnow-state.zip"
          unzip -o -q "$RUNNER_TEMP/indexnow-state.zip" -d "$(dirname "$STATE")"
          echo "Restored the submission saved in artifact $id"

      # Best effort: a failed fetch or a non-2xx answer is logged as a warning, not a failed run.
      - name: Submit new, changed and removed URLs
        run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}

      - name: Save this submission
        if: hashFiles('.indexnow/sitemap.tsv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-state
          path: .indexnow/sitemap.tsv
          retention-days: 30
          # The state sits in a dot directory, which upload-artifact skips by default
          include-hidden-files: true
