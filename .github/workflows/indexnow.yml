name: Submit changed URLs to IndexNow

# After a production deploy, tells Bing and the other IndexNow engines which sitemap URLs are new,
# changed (their <lastmod> moved) or removed since the previous run (scripts/indexnow.mjs).
# Vercel's GitHub integration reports each deploy as a deployment status. The previous run's
# sitemap is kept in the Actions cache; without it (first run, or the cache expired after 7 days
# unused) every URL is submitted. Run it by hand with "all" to resubmit every URL.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: Submit every sitemap URL, not only the changed ones
        type: boolean
        default: false

permissions:
  contents: read

# Runs one at a time, so each one compares against the state the one before it saved
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: vaneui.com
      # Public by design: the same key is served at https://vaneui.com/<key>.txt (public/<key>.txt)
      KEY: ec9fdd632f2ec35dadf86895f61340ac
      STATE: .indexnow/sitemap.tsv
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore the previous submission
        uses: actions/cache/restore@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-

      # Best effort: a failed fetch or a non-2xx answer is logged as a warning, not a failed run.
      - name: Submit new, changed and removed URLs
        run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}

      - name: Save this submission
        if: hashFiles('.indexnow/sitemap.tsv') != ''
        uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}-${{ github.run_attempt }}
