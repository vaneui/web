name: Update VaneUI packages

# Picks up new @vaneui/ui and @vaneui/md releases; the push redeploys the site on Vercel.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-vaneui
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Compares installed versions, not the lockfile diff, so a platform-only lockfile rewrite is ignored.
      - name: Update VaneUI Packages
        id: diff
        run: |
          versions() { node -p "['ui','md'].map(p => require('./node_modules/@vaneui/' + p + '/package.json').version).join(' ')"; }
          before=$(versions)
          npm update @vaneui/ui @vaneui/md
          after=$(versions)
          echo "Installed: $before -> $after"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ui=${after% *}" >> "$GITHUB_OUTPUT"
            echo "md=${after#* }" >> "$GITHUB_OUTPUT"
          fi

      # Gates on check:examples, typecheck and lint, and regenerates public/llms*.txt.
      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Commit and Push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/llms.txt public/llms-full.txt
          git commit -m "chore: upgrade to @vaneui/ui ${{ steps.diff.outputs.ui }} and @vaneui/md ${{ steps.diff.outputs.md }}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
