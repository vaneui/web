name: Update VaneUI packages

# Keeps the site on the newest @vaneui/ui and @vaneui/md releases of the major package.json is on;
# the push redeploys it on Vercel. A new major is never installed here: the job says so in its log.
on:
  # Off the top of the hour: GitHub delays or drops scheduled runs at :00 under load.
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-vaneui
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Compares installed versions, not the lockfile diff, so a platform-only lockfile rewrite is ignored.
      - name: Update VaneUI Packages
        id: diff
        run: |
          versions() { node -p "['ui','md'].map(p => require('./node_modules/@vaneui/' + p + '/package.json').version).join(' ')"; }
          # The major package.json is on: the first number of the dependency's range (^1.5.0 gives 1).
          major() { node -p "const found = /\d+/.exec(require('./package.json').dependencies['@vaneui/$1'] ?? ''); if (!found) throw new Error('package.json has no version range for @vaneui/$1'); found[0]"; }
          # Says so when the registry has a major above the one this job stays on.
          newer_major() {
            latest=$(npm view "@vaneui/$1" version 2>/dev/null) || return 0
            if [ "${latest%%.*}" -gt "$2" ] 2>/dev/null; then
              echo "::warning::@vaneui/$1 $latest is a new major. This job stays on ^$2: move package.json to the new major by hand."
            fi
          }
          before=$(versions)
          ui_major=$(major ui)
          md_major=$(major md)
          # The newest release of the current major, not @latest: a new major can break the site, and the
          # push below deploys. npm install with a range, not npm update, so package.json follows.
          npm install "@vaneui/ui@^$ui_major" "@vaneui/md@^$md_major"
          after=$(versions)
          echo "Installed: $before -> $after"
          newer_major ui "$ui_major"
          newer_major md "$md_major"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ui=${after% *}" >> "$GITHUB_OUTPUT"
            echo "md=${after#* }" >> "$GITHUB_OUTPUT"
          fi

      # Catches a library change the build alone would not, such as a new include error format.
      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      # Gates on check:examples, typecheck and lint, and regenerates public/llms*.txt.
      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Commit and Push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/llms.txt public/llms-full.txt
          git commit -m "chore: upgrade to @vaneui/ui ${{ steps.diff.outputs.ui }} and @vaneui/md ${{ steps.diff.outputs.md }}"
          # --autostash: a file the build rewrote but the bump does not commit must not stop the rebase.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
