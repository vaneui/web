name: Test

# Runs the unit tests and the production build for every pull request and every push to main,
# so a change that breaks either is seen before it is merged or deployed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces its run in progress; runs on main all finish.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Gates on check:examples, typecheck and lint before the Next.js build.
      - name: Build
        run: npm run build
